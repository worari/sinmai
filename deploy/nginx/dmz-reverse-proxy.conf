# ==============================================================================
# deploy/nginx/dmz-reverse-proxy.conf
# การตั้งค่า Nginx Reverse Proxy สำหรับติดตั้งบนเครื่อง Front-end / DMZ (103.146.204.84)
# เพื่อส่งต่อคำขอทั้งหมดไปยังเซิร์ฟเวอร์ระบบสินไหม ทบ. (10.200.2.168)
# ==============================================================================

upstream backend_rta_sinmai {
    # ชี้มายัง IP ของเครื่องเซิร์ฟเวอร์ภายใน
    server 10.200.2.168:443;
    keepalive 64;
}

# 1. HTTP Server (Port 80) -> Redirect เป็น HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sinmai.rta.mi.th 103.146.204.84;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Port 443) -> Reverse Proxy ไปยัง 10.200.2.168
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sinmai.rta.mi.th 103.146.204.84;

    # SSL Certificate
    ssl_certificate /etc/letsencrypt/live/sinmai.rta.mi.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sinmai.rta.mi.th/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # Timeouts
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;

    # WebSocket / Socket.io
    location /socket.io/ {
        proxy_pass https://backend_rta_sinmai;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    # Proxy หลัก
    location / {
        proxy_pass https://backend_rta_sinmai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_ssl_verify off;
    }
}

