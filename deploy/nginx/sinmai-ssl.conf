# /etc/nginx/sites-available/sinmai
# ==============================================================================
# 🎖️ ระบบเสนอขอรับสิทธิเงินค่าสินไหมทดแทน กองทัพบก (RTA Claim Management System)
# การตั้งค่า Nginx Reverse Proxy (HTTPS + HTTP/2 + WebSocket + Auto Redirect)
# โดเมน: sinmai.rta.mi.th | IP: 103.146.204.84 / 10.200.2.168
# ==============================================================================

upstream rta_sinmai_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80) -> ส่งต่อไป HTTPS อัตโนมัติ
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sinmai.rta.mi.th 103.146.204.84 10.200.2.168;

    # สำหรับการต่ออายุ SSL อัตโนมัติของ Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # บังคับ Redirect ไปเป็น HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Port 443 + HTTP/2 + SSL)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sinmai.rta.mi.th 103.146.204.84 10.200.2.168;

    # --------------------------------------------------------------------------
    # SSL Certificate Paths
    # (เลือกใช้งานแบบใดแบบหนึ่ง: Let's Encrypt หรือ Custom Cert ของ ทบ.)
    # --------------------------------------------------------------------------
    # แบบ ก: Let's Encrypt (Certbot)
    ssl_certificate /etc/letsencrypt/live/sinmai.rta.mi.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sinmai.rta.mi.th/privkey.pem;

    # แบบ ข: หากใช้ใบรับรองของ ทบ. (Custom Certificate) ให้สลับมาเปิด 2 บรรทัดนี้แทน
    # ssl_certificate /etc/ssl/certs/sinmai.rta.mi.th.crt;
    # ssl_certificate_key /etc/ssl/private/sinmai.rta.mi.th.key;

    # ความปลอดภัยและการเข้ารหัส SSL/TLS (Modern TLS)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # อนุญาตขนาดไฟล์อัปโหลดสูงสุด 100MB (เอกสารหลักฐาน กพ.4, ใบมรณบัตร, ไฟล์ PDF/รูปภาพ)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Proxy Timeouts (90 วินาที ป้องกัน Request ตัดเวลาอัปโหลดไฟล์ขนาดใหญ่)
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;
    send_timeout 90;

    # การบีบอัดข้อมูล Gzip ลดการใช้ Bandwidth และเพิ่มความเร็วในการโหลด
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # แคชไฟล์สแตติก Next.js ในหน่วยความจำเบราว์เซอร์ 1 ปี
    location /_next/static/ {
        proxy_pass http://rta_sinmai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # แคชไฟล์สาธารณะ (Favicon, Logo, Images) 30 วัน
    location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        proxy_pass http://rta_sinmai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # WebSocket / Socket.IO สำหรับ Real-time Dashboard & Notification
    location /socket.io/ {
        proxy_pass http://rta_sinmai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    # Proxy หลักส่งคำขอไปยัง Next.js Application
    location / {
        proxy_pass http://rta_sinmai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
    }
}

