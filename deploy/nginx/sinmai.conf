# /etc/nginx/sites-available/sinmai
# การตั้งค่า Nginx Reverse Proxy สำหรับระบบเสนอขอรับสิทธิเงินค่าสินไหมทดแทน ทบ.

# กำหนด Upstream เชื่อมต่อ Node.js / PM2 ที่พอร์ต 3000
upstream rta_sinmai_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    
    # กำหนดโดเมนเนม หรือ ไอพีเซิร์ฟเวอร์ (แก้ไขเป็นโดเมนของท่าน เช่น sinmai.army.mil.th หรือ ใส่ _ เพื่อรับทุก Host)
    server_name _;

    # ขนาดไฟล์อัปโหลดสูงสุด (สำหรับเอกสารชันสูตรพลิกศพ, เอกสารเสนอเรื่อง, ไฟล์นำเข้า Excel)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;
    send_timeout 90;

    # Gzip Compression เพื่อความเร็วในการโหลด
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ไฟล์ Static Assets ของ Next.js แคชในเบราว์เซอร์เพื่อความรวดเร็ว
    location /_next/static/ {
        proxy_pass http://rta_sinmai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ไฟล์ในโฟลเดอร์ public (เช่น โลโก้, ฟอนต์, ไอคอน)
    location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        proxy_pass http://rta_sinmai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # รองรับ Socket.IO สำหรับ Real-time Dashboard & การแจ้งเตือน
    location /socket.io/ {
        proxy_pass http://rta_sinmai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Proxy หลักส่งคำขอไปยัง Next.js App
    location / {
        proxy_pass http://rta_sinmai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # รองรับ HTTP keep-alive
        proxy_set_header Connection "";
    }
}

